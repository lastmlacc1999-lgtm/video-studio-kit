name: drive-relay

on:
  workflow_dispatch:
    inputs:
      session_uri:
        description: Pre-authorized Google Drive resumable upload session URI
        required: true
        type: string

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the two Drive parts
        run: |
          set -euo pipefail
          pip install --quiet gdown

          download() {
            id="$1"; out="$2"; expected="$3"
            rm -f "$out"
            curl -fL --retry 3 --retry-delay 2 --max-time 600 \
              -o "$out" "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" || true
            if [ ! -s "$out" ] || head -c 300 "$out" | grep -qi '<!DOCTYPE html'; then
              rm -f "$out"
              gdown --id "$id" -O "$out"
            fi
            actual=$(stat -c%s "$out")
            echo "$out: $actual bytes (expected $expected)"
            [ "$actual" = "$expected" ]
          }

          download "1XFSRV1a-mCYxn_G_2Q3dWHOpJ2DnpXM2" part0 94371840
          download "16dp1v_17Iowoiy678Fd1GKqeZ1Oro5mR" part1 69581214

          cat part0 part1 > kit.zip
          echo "73320e9c58998ea74a91fa3a693990dc34070fd13c3a971b35213702694fc9cc  kit.zip" | sha256sum -c -
          ls -l kit.zip

      - name: Stream to Google Drive
        env:
          SESSION_URI: ${{ inputs.session_uri }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          uri = os.environ['SESSION_URI']
          path = 'kit.zip'
          total = os.path.getsize(path)
          chunk = 8 * 1024 * 1024

          def put(data, offset, command):
              req = urllib.request.Request(uri, data=data, method='PUT')
              req.add_header('Content-Type', 'application/octet-stream')
              req.add_header('X-Goog-Upload-Offset', str(offset))
              req.add_header('X-Goog-Upload-Command', command)
              req.add_header('X-Goog-Upload-Total-Size', str(total))
              try:
                  with urllib.request.urlopen(req, timeout=180) as r:
                      return r.status, dict(r.headers), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()

          status, headers, body = put(b'', 0, 'query')
          received = headers.get('X-Goog-Upload-Size-Received') or '0'
          try:
              offset = int(received)
          except ValueError:
              offset = 0
          if status not in (200, 308):
              print('query returned', status, body[:300])
              offset = 0
          print('starting at', offset, 'of', total, 'bytes', flush=True)

          with open(path, 'rb') as f:
              while offset < total:
                  end = min(offset + chunk, total)
                  f.seek(offset)
                  data = f.read(end - offset)
                  command = 'upload, finalize' if end == total else 'upload'
                  for attempt in range(1, 5):
                      status, headers, body = put(data, offset, command)
                      state = headers.get('X-Goog-Upload-Status')
                      print(offset, end, status, state, flush=True)
                      if status in (200, 308) and state in (None, 'active', 'final'):
                          break
                      if attempt == 4:
                          print(body[:1000].decode('utf-8', 'replace'))
                          raise SystemExit('chunk failed')
                      time.sleep(1.5 * attempt)
                  offset = end

          if status == 200 and (headers.get('X-Goog-Upload-Status') == 'final' or offset == total):
              try:
                  info = json.loads(body.decode('utf-8'))
                  print('uploaded file id:', info.get('id'))
                  print('size:', info.get('size'))
              except Exception:
                  print(body[:1000].decode('utf-8', 'replace'))
          print('done')
          PY
